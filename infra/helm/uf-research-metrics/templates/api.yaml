apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ufrm.fullname" . }}-api
  labels:
    {{- include "ufrm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "ufrm.selectorLabels" (dict "component" "api" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ufrm.selectorLabels" (dict "component" "api" "root" .) | nindent 8 }}
    spec:
      containers:
        - name: api
          image: {{ include "ufrm.image" (dict "component" "api" "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: {{ include "ufrm.fullname" . }}-config
            - secretRef:
                name: {{ .Values.externalSecret.targetSecretName }}
          readinessProbe:
            httpGet: { path: /api/health, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3001 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ufrm.fullname" . }}-api
  labels:
    {{- include "ufrm.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ufrm.selectorLabels" (dict "component" "api" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: 3001
      targetPort: 3001
