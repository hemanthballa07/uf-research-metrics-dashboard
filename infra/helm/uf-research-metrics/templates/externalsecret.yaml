{{- if .Values.externalSecret.enabled }}
# Cluster-scoped store would also work; namespaced SecretStore keeps blast radius small.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecret.secretStoreName }}
  labels:
    {{- include "ufrm.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.config.AWS_REGION | default "us-east-1" }}
      # Auth via IRSA — the external-secrets ServiceAccount is annotated with the ESO IAM role.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "ufrm.fullname" . }}-secrets
  labels:
    {{- include "ufrm.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ .Values.externalSecret.targetSecretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.remoteSecretName }}
{{- end }}
