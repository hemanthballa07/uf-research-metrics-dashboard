{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ufrm.fullname" . }}
  labels:
    {{- include "ufrm.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          # /api → api Service; everything else → web (SPA). The web image is built with
          # VITE_API_URL="" so the SPA calls same-origin /api through this one ALB.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "ufrm.fullname" . }}-api
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ufrm.fullname" . }}-web
                port:
                  number: 80
{{- end }}
