{{- if .Values.serviceMonitor.enabled }}
# PrometheusRule for the kube-prometheus-stack operator.
#
# DUPLICATION NOTICE: the recording rules + alert rules below are duplicated
# verbatim from the repo-root files `recording.rules.yml` and `alert.rules.yml`.
# The repo-root files are the docker-compose source of truth; this template is
# the K8s source of truth. Keep them in sync.
#
# Why duplicated rather than `.Files.Get "../../../recording.rules.yml"`:
# Helm rejects `.Files.Get` paths that traverse outside the chart root with
# `path is below the chart root`. Relocating the canonical YAML into
# `infra/helm/uf-research-metrics/files/` + symlinking from repo root is the
# proper next step — tracked as out-of-scope for this workstream.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "ufrm.fullname" . }}-slo
  labels:
    {{- include "ufrm.labels" . | nindent 4 }}
    release: kube-prometheus-stack   # match operator's ruleSelector
spec:
  groups:
    - name: uf-slo-recording
      interval: 30s
      rules:
        - record: sli:availability_ratio:rate5m
          expr: |
            1 - (
              sum(rate(http_requests_total{status_code=~"5.."}[5m]))
              /
              clamp_min(sum(rate(http_requests_total[5m])), 1e-12)
            )
        - record: sli:availability_ratio:rate30m
          expr: |
            1 - (
              sum(rate(http_requests_total{status_code=~"5.."}[30m]))
              /
              clamp_min(sum(rate(http_requests_total[30m])), 1e-12)
            )
        - record: sli:availability_ratio:rate1h
          expr: |
            1 - (
              sum(rate(http_requests_total{status_code=~"5.."}[1h]))
              /
              clamp_min(sum(rate(http_requests_total[1h])), 1e-12)
            )
        - record: sli:availability_ratio:rate6h
          expr: |
            1 - (
              sum(rate(http_requests_total{status_code=~"5.."}[6h]))
              /
              clamp_min(sum(rate(http_requests_total[6h])), 1e-12)
            )
        - record: sli:read_p95_seconds:rate5m
          expr: |
            histogram_quantile(0.95,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{route!~"/api/ingest/.*"}[5m])
              )
            )
        - record: sli:ingest_success_ratio:rate30m
          expr: |
            1 - (
              sum(rate(batches_processed_total{result!="ok"}[30m]))
              /
              clamp_min(sum(rate(batches_processed_total[30m])), 1e-12)
            )
        - record: sli:ingest_success_ratio:rate6h
          expr: |
            1 - (
              sum(rate(batches_processed_total{result!="ok"}[6h]))
              /
              clamp_min(sum(rate(batches_processed_total[6h])), 1e-12)
            )

    - name: uf-research-metrics-slo
      interval: 30s
      rules:
        - alert: AvailabilityBudgetBurnFast
          expr: |
            (1 - sli:availability_ratio:rate5m) > (14.4 * 0.001)
            and
            (1 - sli:availability_ratio:rate1h) > (14.4 * 0.001)
            and
            sum(rate(http_requests_total[1h])) > 0.1
          for: 2m
          labels:
            severity: critical
            slo: availability
          annotations:
            summary: "Availability fast burn (2% of monthly budget in 1h)"
            runbook: "docs/RUNBOOK.md#slos-and-error-budget"

        - alert: AvailabilityBudgetBurnSlow
          expr: |
            (1 - sli:availability_ratio:rate30m) > (6 * 0.001)
            and
            (1 - sli:availability_ratio:rate6h) > (6 * 0.001)
            and
            sum(rate(http_requests_total[6h])) > 0.05
          for: 15m
          labels:
            severity: warning
            slo: availability
          annotations:
            summary: "Availability slow burn (10% of monthly budget in 6h)"

        - alert: ReadLatencyP95Breach
          expr: |
            sli:read_p95_seconds:rate5m > 1.0
            and
            sum(rate(http_request_duration_seconds_count{route!~"/api/ingest/.*"}[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
            slo: latency
          annotations:
            summary: "Read-mix p95 latency > 1s for 5m"

        - alert: IngestSuccessBudgetBurnFast
          expr: |
            (1 - sli:ingest_success_ratio:rate30m) > (14.4 * 0.005)
            and
            (1 - sli:ingest_success_ratio:rate6h) > (14.4 * 0.005)
            and
            sum(rate(batches_processed_total[6h])) > 0.01
          for: 5m
          labels:
            severity: critical
            slo: ingest_success
          annotations:
            summary: "Ingest success rate below 99.5% (fast burn)"

        - alert: APIDown
          expr: up{job="uf-research-metrics-api"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "API service unreachable"
{{- end }}
