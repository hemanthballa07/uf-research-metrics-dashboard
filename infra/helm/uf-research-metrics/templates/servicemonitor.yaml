{{- if .Values.serviceMonitor.enabled }}
# Requires the kube-prometheus-stack CRDs (installed as a separate release).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ufrm.fullname" . }}-api
  labels:
    {{- include "ufrm.labels" . | nindent 4 }}
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      {{- include "ufrm.selectorLabels" (dict "component" "api" "root" .) | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ufrm.fullname" . }}-worker
  labels:
    {{- include "ufrm.labels" . | nindent 4 }}
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      {{- include "ufrm.selectorLabels" (dict "component" "ingest-worker" "root" .) | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
{{- end }}
