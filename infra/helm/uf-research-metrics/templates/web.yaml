apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ufrm.fullname" . }}-web
  labels:
    {{- include "ufrm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "ufrm.selectorLabels" (dict "component" "web" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ufrm.selectorLabels" (dict "component" "web" "root" .) | nindent 8 }}
    spec:
      containers:
        - name: web
          image: {{ include "ufrm.image" (dict "component" "web" "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ufrm.fullname" . }}-web
  labels:
    {{- include "ufrm.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ufrm.selectorLabels" (dict "component" "web" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 80
