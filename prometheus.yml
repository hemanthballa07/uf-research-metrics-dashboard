global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert.rules.yml
  - /etc/prometheus/recording.rules.yml

scrape_configs:
  - job_name: uf-research-metrics-api
    static_configs:
      - targets:
          - api:3001
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: uf-research-metrics-ingest-worker
    static_configs:
      - targets:
          - ingest-worker:3003
    metrics_path: /metrics
    scrape_interval: 15s
