# SLI recording rules for uf-research-metrics-platform.
#
# Each ratio is computed as 1 - (errors / clamp_min(total, 1e-12)) so that at
# zero traffic the SLI is 1.0 ("perfect, no errors observed") rather than NaN.
# The 1e-12 clamp is mathematically inert under any real traffic level.
#
# Loaded by:
#   - prometheus.yml (docker-compose path) via `rule_files: [recording.rules.yml]`
#   - infra/helm/uf-research-metrics/templates/prometheusrule.yaml (K8s path)
#     duplicates these rules verbatim — keep both in sync.
groups:
  - name: uf-slo-recording
    interval: 30s
    rules:
      # Availability SLI: 1 - (5xx_rate / total_rate). Multiple windows used
      # by the multi-window burn-rate alerts in alert.rules.yml.
      - record: sli:availability_ratio:rate5m
        expr: |
          1 - (
            sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total[5m])), 1e-12)
          )
      - record: sli:availability_ratio:rate30m
        expr: |
          1 - (
            sum(rate(http_requests_total{status_code=~"5.."}[30m]))
            /
            clamp_min(sum(rate(http_requests_total[30m])), 1e-12)
          )
      - record: sli:availability_ratio:rate1h
        expr: |
          1 - (
            sum(rate(http_requests_total{status_code=~"5.."}[1h]))
            /
            clamp_min(sum(rate(http_requests_total[1h])), 1e-12)
          )
      - record: sli:availability_ratio:rate6h
        expr: |
          1 - (
            sum(rate(http_requests_total{status_code=~"5.."}[6h]))
            /
            clamp_min(sum(rate(http_requests_total[6h])), 1e-12)
          )

      # Latency SLI: p95 of read-mix endpoints. Excludes /api/ingest/* because
      # writes have a different SLO. The C.0 normalizeRoute patch makes the
      # `route` label include the mount prefix, so this regex actually matches.
      - record: sli:read_p95_seconds:rate5m
        expr: |
          histogram_quantile(0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{route!~"/api/ingest/.*"}[5m])
            )
          )

      # Ingest SLI: 1 - (non-ok batch rate / total batch rate). Worker label
      # values: ok | dlq | error.
      - record: sli:ingest_success_ratio:rate30m
        expr: |
          1 - (
            sum(rate(batches_processed_total{result!="ok"}[30m]))
            /
            clamp_min(sum(rate(batches_processed_total[30m])), 1e-12)
          )
      - record: sli:ingest_success_ratio:rate6h
        expr: |
          1 - (
            sum(rate(batches_processed_total{result!="ok"}[6h]))
            /
            clamp_min(sum(rate(batches_processed_total[6h])), 1e-12)
          )
